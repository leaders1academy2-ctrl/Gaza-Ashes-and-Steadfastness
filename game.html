<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at center, #2a2a2e 0%, #0d0d10 100%);
        font-family: 'Segoe UI', Tahoma, sans-serif;
        touch-action: manipulation; overflow: hidden; color: #e0e0e0; padding: 10px;
    }
    .game-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 10px; position: relative; }

    .game-container {
        position: relative; width: 100%;
        box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        border-radius: 14px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
    }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 16/9; touch-action: none; }

    .story-panel {
        background: rgba(15,15,20,0.9); border: 1px solid rgba(255,255,255,0.08);
        padding: 12px 20px; border-radius: 10px; text-align: center;
        font-size: 13px; line-height: 1.6; color: #ccc;
        backdrop-filter: blur(8px); min-height: 55px;
        display: flex; align-items: center; justify-content: center;
    }
    .controls-panel { display: flex; justify-content: space-between; gap: 15px; }
    .btn {
        flex: 1; height: 55px;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
        cursor: pointer; display: flex; justify-content: center; align-items: center;
        transition: all 0.1s ease;
    }
    .btn:active, .btn.pressed {
        transform: scale(0.96); background: rgba(212,175,55,0.2); border-color: #d4af37;
    }
    .btn svg { width: 28px; height: 28px; fill: #ccc; }

    /* زر تبديل اللغة العائم */
    .lang-switch-btn {
        position: fixed;
        top: 15px;
        padding: 8px 16px;
        background: rgba(15, 15, 20, 0.9);
        border: 1px solid rgba(212, 175, 55, 0.5);
        border-radius: 8px;
        color: #d4af37;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        backdrop-filter: blur(8px);
        z-index: 100;
        transition: all 0.2s;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    .lang-switch-btn:hover {
        background: rgba(212, 175, 55, 0.15);
        border-color: #d4af37;
    }
    .lang-switch-btn.hidden { display: none; }
</style>
</head>

function t(key) {
    const dict = translations[currentLang];
    if (dict && Object.prototype.hasOwnProperty.call(dict, key)) {
        return dict[key];
    }
    return key;
}

function startTransition(targetScene, callback) {

function updateTransition() {
    transitionAlpha += (transitionTarget - transitionAlpha) * 0.08;
    if (transitionTarget === 1 && transitionAlpha > 0.98) {
        currentScene = pendingScene;

        updateLangSwitchVisibility();

    if (transitionTarget === 0 && transitionAlpha < 0.02) transitionAlpha = 0;

let audioCtx = null;
let isAudioActive = false;
let soundTimeout = null;
let activeNodes = [];
let roadSoundsPaused = false;
let noiseBuffer = null;

function getNoiseBuffer() {
    if (noiseBuffer || !audioCtx) return noiseBuffer;
    const length = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    noiseBuffer = buf;
    return noiseBuffer;
}

function startAudio() {
    if (isAudioActive) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isAudioActive = true;
        scheduleNextSound();
    } catch(e) {}
}

function stopAllAudio() {
    isAudioActive = false;
    if (soundTimeout) { clearTimeout(soundTimeout); soundTimeout = null; }
    activeNodes.forEach(node => { try { node.stop(); } catch(e) {} });
    activeNodes = [];
    if (audioCtx && audioCtx.state === 'running') { try { audioCtx.suspend(); } catch(e) {} }
}

function playRustle() {
    if (!audioCtx || !isAudioActive || roadSoundsPaused) return;
    try {
        const now = audioCtx.currentTime;
        const duration = 1.8 + Math.random() * 0.8;
        const source = audioCtx.createBufferSource();
        source.buffer = getNoiseBuffer();
        source.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(700, now);
        filter.frequency.linearRampToValueAtTime(1200, now + duration * 0.5);
        filter.frequency.linearRampToValueAtTime(500, now + duration);
        filter.Q.value = 0.8;
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 1.5;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.035, now + duration * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.022, now + duration * 0.7);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        source.connect(filter); filter.connect(bp); bp.connect(gain); gain.connect(audioCtx.destination);
        source.start(now); source.stop(now + duration);
        activeNodes.push(source);
        setTimeout(() => { activeNodes = activeNodes.filter(n => n !== source); }, (duration + 0.5) * 1000);
    } catch(e) {}
}

function playDistantWhistle() {
    if (!audioCtx || !isAudioActive || roadSoundsPaused) return;
    try {
        const now = audioCtx.currentTime;
        const duration = 2.0 + Math.random() * 0.8;
        const baseFreqs = [392, 440, 494, 523, 587];
        const baseFreq = baseFreqs[Math.floor(Math.random() * baseFreqs.length)];
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.linearRampToValueAtTime(baseFreq * 1.05, now + duration * 0.4);
        osc.frequency.linearRampToValueAtTime(baseFreq * 0.92, now + duration);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 2000; filter.Q.value = 0.5;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.028, now + duration * 0.4);
        gain.gain.exponentialRampToValueAtTime(0.018, now + duration * 0.75);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        const delay = audioCtx.createDelay(); delay.delayTime.value = 0.28;
        const feedback = audioCtx.createGain(); feedback.gain.value = 0.25;
        const delayGain = audioCtx.createGain(); delayGain.gain.value = 0.3;
        osc.connect(filter); filter.connect(gain);
        gain.connect(audioCtx.destination);
        gain.connect(delay); delay.connect(feedback); feedback.connect(delay);
        delay.connect(delayGain); delayGain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + duration);
        activeNodes.push(osc);
        setTimeout(() => { activeNodes = activeNodes.filter(n => n !== osc); }, (duration + 1.5) * 1000);
    } catch(e) {}
}

function scheduleNextSound() {
    if (!isAudioActive) return;
    if (!roadSoundsPaused) {
        if (Math.random() < 0.5) playRustle(); else playDistantWhistle();
    }
    soundTimeout = setTimeout(scheduleNextSound, 12000 + Math.random() * 13000);
}

function playPip() {
    if (!audioCtx || !isAudioActive) return;

        const now = audioCtx.currentTime;

        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.2);
        activeNodes.push(osc);
        setTimeout(() => { activeNodes = activeNodes.filter(n => n !== osc); }, 300);
    } catch(e) {}
}

    if (!audioCtx || !isAudioActive) return;

function playReject() {
    if (!audioCtx || !isAudioActive) return;

function playKeySound() {
    if (!audioCtx || !isAudioActive) return;
    try {
        const now = audioCtx.currentTime;
        [1046.50, 1318.51, 1567.98].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const tt = now + i * 0.08;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, tt);
            gain.gain.setValueAtTime(0.0001, tt);
            gain.gain.exponentialRampToValueAtTime(0.028, tt + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, tt + 0.6);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(tt); osc.stop(tt + 0.7);
            activeNodes.push(osc);
            setTimeout(() => { activeNodes = activeNodes.filter(n => n !== osc); }, 900);
        });
    } catch(e) {}
}

function playThunder() {
    if (!audioCtx || !isAudioActive || roadSoundsPaused) return;
    try {
        const now = audioCtx.currentTime;
        const duration = 1.5 + Math.random() * 1.0;
        const source = audioCtx.createBufferSource();

        filter.Q.value = 0.5;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.02, now + duration * 0.4);

// ===================== رسم شاشة اختيار اللغة =====================
function drawLanguageSelectionScreen() {
    // خلفية سماء داكنة
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#1a1a22');
    skyGrad.addColorStop(0.5, '#2a2a32');
    skyGrad.addColorStop(1, '#0a0a10');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // شرارات خفيفة في الخلف
    const time = Date.now() / 1000;
    for (let i = 0; i < 30; i++) {
        const x = (i * 137.5 + time * 20) % W;
        const y = (i * 73.3 + time * 10) % H;
        const alpha = 0.15 + Math.sin(time + i) * 0.1;
        ctx.fillStyle = `rgba(212, 175, 55, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // العنوان بالعربي (دائماً)
    ctx.textAlign = 'center';
    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 42px "Segoe UI", Tahoma';
    ctx.fillText('غزة: أطياف الرماد والصمود', W/2, 130);

    // العنوان بالإنجليزي (دائماً، بخط أصغر)
    ctx.fillStyle = 'rgba(212, 175, 55, 0.6)';
    ctx.font = '18px "Segoe UI", Tahoma';
    ctx.fillText('Gaza: Specters of Ash and Resilience', W/2, 165);

    // خط فاصل ذهبي
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W/2 - 200, 190);
    ctx.lineTo(W/2 + 200, 190);
    ctx.stroke();

    // نص "اختر اللغة" حسب اللغة الحالية
    ctx.fillStyle = '#e0e0e0';
    ctx.font = 'bold 24px "Segoe UI", Tahoma';
    ctx.fillText(t('lang.choose'), W/2, 245);

    // بطاقات اللغات (تمرير أفقي)
    const cardW = 220;
    const cardH = 140;
    const gap = 60;
    const totalW = cardW * 2 + gap;
    const startX = (W - totalW) / 2 + langScrollX;
    const cardY = 290;

    // البطاقة العربية
    drawLangCard(startX, cardY, cardW, cardH, 'العربية', '🇸🇦', currentLang === 'ar', 0);
    // البطاقة الإنجليزية
    drawLangCard(startX + cardW + gap, cardY, cardW, cardH, 'English', '🇬🇧', currentLang === 'en', 1);

    // نص صغير أسفل - تلميح التمرير
    ctx.fillStyle = 'rgba(180, 180, 180, 0.5)';
    ctx.font = '14px "Segoe UI", Tahoma';
    ctx.fillText('← →', W/2, H - 40);

    // شريط تمرير صغير
    const barY = H - 25;
    const barW = 200;
    const barX = W/2 - barW/2;
    ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
    ctx.fillRect(barX, barY, barW, 3);
    // موضع التمرير الحالي
    const scrollRatio = Math.min(1, Math.max(0, -langScrollX / gap));
    ctx.fillStyle = 'rgba(212, 175, 55, 0.7)';
    ctx.fillRect(barX + scrollRatio * (barW - 60), barY, 60, 3);
}

function drawLangCard(x, y, w, h, label, flag, isSelected, index) {
    // ظل البطاقة
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(x + 4, y + 4, w, h);

    // خلفية البطاقة
    if (isSelected) {
        ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
    } else {
        ctx.fillStyle = 'rgba(30, 30, 38, 0.9)';
    }
    ctx.fillRect(x, y, w, h);

    // إطار البطاقة
    ctx.strokeStyle = isSelected ? '#d4af37' : 'rgba(150, 150, 150, 0.4)';
    ctx.lineWidth = isSelected ? 3 : 1.5;
    ctx.strokeRect(x, y, w, h);

    // علم
    ctx.font = '52px "Segoe UI", Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText(flag, x + w/2, y + 70);

    // اسم اللغة
    ctx.fillStyle = isSelected ? '#d4af37' : '#e0e0e0';
    ctx.font = 'bold 26px "Segoe UI", Tahoma';
    ctx.fillText(label, x + w/2, y + 115);
}

        ctx.moveTo(wx + 35, wy + 5); ctx.lineTo(wx + 5, wy + 40);
        ctx.stroke();
    }

    const doorW = 45;

            ctx.fillRect(dx - 3, dy - 3, doorW + 6, doorH + 3);

    ctx.fillStyle = 'rgba(15, 10, 5, 0.7)';
    ctx.beginPath();
    ctx.moveTo(screenX + hospW - 40, baseY - hospH + 30);
    ctx.lineTo(screenX + hospW - 15, baseY - hospH + 80);
    ctx.lineTo(screenX + hospW - 45, baseY - hospH + 130);
    ctx.lineTo(screenX + hospW - 20, baseY - hospH + 180);
    ctx.lineTo(screenX + hospW - 35, baseY - 30);
    ctx.lineTo(screenX + hospW - 5, baseY - 30);
    ctx.closePath();
    ctx.fill();

    const smokeTime = Date.now() / 1000;
    for (let i = 0; i < 5; i++) {
        const smokeX = screenX + hospW - 30 + Math.sin(smokeTime + i) * 12;
        const smokeY = baseY - hospH + 40 - i * 25 - (smokeTime * 8 + i * 20) % 80;
        ctx.fillStyle = `rgba(55, 55, 60, ${0.3 - i * 0.05})`;
        ctx.beginPath();
        ctx.arc(smokeX, smokeY, 14 + i * 6, 0, Math.PI * 2);

    ctx.fillStyle = '#5a5a62';
    ctx.beginPath();
    ctx.arc(screenX + 40, baseY - 3, 7, 0, Math.PI * 2);

    ctx.arc(screenX + hospW - 40, baseY - 3, 8, 0, Math.PI * 2);

}

function drawEndingScene() {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const tt = endingTimer;

    const endingTexts = [
        { key: 'ending.1', start: 30,  end: 150 },
        { key: 'ending.2', start: 150, end: 270 },
        { key: 'ending.3', start: 270, end: 390 },
        { key: 'ending.4', start: 390, end: 540 }
    ];

    if (tt > 600) {
        const alpha = Math.min(1, (tt - 600) / 60);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#d4af37';
        ctx.font = 'bold 34px "Segoe UI", Tahoma';
        ctx.fillText(t('title.main'), W/2, H/2 - 40);

        ctx.font = 'bold 24px "Segoe UI", Tahoma';
        ctx.fillStyle = '#aaa';
        ctx.fillText(t('title.sub'), W/2, H/2 + 10);

        ctx.font = 'italic 22px "Segoe UI", Tahoma';
        ctx.fillStyle = '#666';
        ctx.fillText(t('ui.continue'), W/2, H/2 + 70);
        ctx.restore();
    }

    endingTexts.forEach((item) => {
        if (tt >= item.start && tt <= item.end) {
            const range = item.end - item.start;
            const progress = (tt - item.start) / range;
            let alpha = 0;
            if (progress < 0.2) alpha = progress / 0.2;
            else if (progress > 0.8) alpha = (1 - progress) / 0.2;
            else alpha = 1;

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#e0e0e0';
            ctx.font = 'bold 32px "Segoe UI", Tahoma';
            ctx.fillText(t(item.key), W/2, H/2);
            ctx.restore();
        }
    });

    if (tt > 900) {
        const alpha = Math.min(1, (tt - 900) / 60);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.font = '22px "Segoe UI", Tahoma';
        ctx.fillStyle = '#888';
        ctx.fillText(t('ending.memories') + ' ' + memoriesCollected, W/2, H - 100);
        const minutes = Math.floor((Date.now() - startTime) / 60000);
        ctx.fillText(t('ending.time') + ' ' + minutes + ' ' + t('ending.minutes'), W/2, H - 70);
        ctx.restore();
    }

    if (tt > 1200 && !gameFinished) {
        const alpha = Math.min(1, (tt - 1200) / 60);
        ctx.save();
        ctx.globalAlpha = alpha;

        const bw = 240, bh = 55;
        const bx = W/2 - bw/2;
        const by = H - 60;
        endingButtonRect = { x: bx, y: by, w: bw, h: bh };

        ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bw, bh);
        ctx.fillStyle = '#d4af37';
        ctx.font = 'bold 22px "Segoe UI", Tahoma';
        ctx.textAlign = 'center';
        ctx.fillText(t('ui.end'), W/2, by + 36);
        ctx.restore();
    }

    if (gameFinished) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(212, 175, 55, 0.6)';
        ctx.font = 'italic 64px "Segoe UI", Tahoma';
        ctx.fillText(t('ui.thanks'), W/2, H/2);
    }
}

const btnForward = document.getElementById('btnForward');

function bindButton(btn, onDown, onUp) {
    btn.addEventListener('mousedown', e => { e.preventDefault(); startAudio(); onDown(); btn.classList.add('pressed'); });
    btn.addEventListener('mouseup', e => { e.preventDefault(); onUp(); btn.classList.remove('pressed'); });
    btn.addEventListener('mouseleave', () => { onUp(); btn.classList.remove('pressed'); });
    btn.addEventListener('touchstart', e => { e.preventDefault(); startAudio(); onDown(); btn.classList.add('pressed'); }, {passive:false});
    btn.addEventListener('touchend', e => { e.preventDefault(); onUp(); btn.classList.remove('pressed'); }, {passive:false});
    btn.addEventListener('touchcancel', () => { onUp(); btn.classList.remove('pressed'); });
}

let touchActive = false;
let touchStartX = 0, touchStartY = 0;
let touchCurrentX = 0, touchCurrentY = 0;
let draggingPiece = null;

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

const BOARD_SCREEN_X = (W - PIC_W * 1.8) / 2;
const BOARD_SCREEN_Y = 80;
const BOARD_SCREEN_W = PIC_W * 1.8;
const BOARD_SCREEN_H = PIC_H * 1.8;
const SLOT_W = BOARD_SCREEN_W / COLS;
const SLOT_H = BOARD_SCREEN_H / ROWS;

const STACK_X = 30;
const STACK_Y = H - 160;
const STACK_PIECE_W = 60;
const STACK_PIECE_H = 45;

function getStackPos(index) {
    const perRow = 6;
    const col = index % perRow;
    const row = Math.floor(index / perRow);
    return {
        x: STACK_X + col * (STACK_PIECE_W + 8),
        y: STACK_Y + row * (STACK_PIECE_H + 8)
    };
}

canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });
canvas.addEventListener('touchcancel', onPointerUp, { passive: false });
canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mouseup', onPointerUp);

function onPointerDown(e) {
    e.preventDefault();
    startAudio();
    const pos = getCanvasPos(e);
    touchActive = true;
    touchStartX = pos.x; touchStartY = pos.y;
    touchCurrentX = pos.x; touchCurrentY = pos.y;

    if (currentScene === 'languageselection') handleLanguageSelectionTouch(pos.x, pos.y);
    else if (currentScene === 'house') handleHouseTouch(pos.x, pos.y);
    else if (currentScene === 'puzzle') handlePuzzleTouch(pos.x, pos.y);
    else if (currentScene === 'message') handleMessageTouch(pos.x, pos.y);
    else if (currentScene === 'classroom') handleClassroomTouch(pos.x, pos.y);
    else if (currentScene === 'drawing') handleDrawingTouch(pos.x, pos.y);
    else if (currentScene === 'letter') handleTeacherLetterTouch(pos.x, pos.y);
    else if (currentScene === 'emergency') handleEmergencyTouch(pos.x, pos.y);
    else if (currentScene === 'file') handleFileTouch(pos.x, pos.y);
    else if (currentScene === 'motherletter') handleMotherLetterTouch(pos.x, pos.y);
    else if (currentScene === 'ending') handleEndingTouch(pos.x, pos.y);
}

function onPointerMove(e) {
    if (!touchActive) return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    touchCurrentX = pos.x; touchCurrentY = pos.y;
    if (currentScene === 'languageselection') {
        langScrollTarget = langScrollStartX + (pos.x - langDragStartX);
        // حدود التمرير
        const maxScroll = 0;
        const minScroll = -60;
        langScrollTarget = Math.max(minScroll, Math.min(maxScroll, langScrollTarget));
        langScrollX += (langScrollTarget - langScrollX) * 0.15;
    }
    if (currentScene === 'puzzle' && draggingPiece) {
        draggingPiece.dragX = pos.x - STACK_PIECE_W/2;
        draggingPiece.dragY = pos.y - STACK_PIECE_H/2;
    }
}

function onPointerUp(e) {
    if (!touchActive) return;
    e.preventDefault();
    touchActive = false;
    const pos = getCanvasPos(e);
    if (currentScene === 'puzzle' && draggingPiece) {
        attemptPlacePiece(draggingPiece, pos.x, pos.y);
        draggingPiece = null;
    }
}

// ===================== تفاعل شاشة اختيار اللغة =====================
function handleLanguageSelectionTouch(px, py) {
    const cardW = 220;
    const cardH = 140;
    const gap = 60;
    const totalW = cardW * 2 + gap;
    const startX = (W - totalW) / 2 + langScrollX;
    const cardY = 290;

    // البطاقة العربية
    if (px > startX && px < startX + cardW && py > cardY && py < cardY + cardH) {
        applyLanguage('ar');
        startAudio();
        startTransition('road', () => {
            storyBox.innerText = t('story.intro');
        });
        return;
    }
    // البطاقة الإنجليزية
    const enX = startX + cardW + gap;
    if (px > enX && px < enX + cardW && py > cardY && py < cardY + cardH) {
        applyLanguage('en');
        startAudio();
        startTransition('road', () => {
            storyBox.innerText = t('story.intro');
        });
        return;
    }
}

// تفاعل التمرير - start
const origPointerDown = onPointerDown;
window.addEventListener('touchstart', (e) => {
    if (currentScene === 'languageselection') {
        const pos = getCanvasPos(e);
        isDraggingLang = true;
        langDragStartX = pos.x;
        langScrollStartX = langScrollX;

}, { passive: true });

// ===================== تفاعل الغرفة =====================
function handleHouseTouch(px, py) {
    for (let p of pieces) {
        if (p.collected || p.placed) continue;
        const screenX = p.roomX - roomX;
        if (screenX < -50 || screenX > W + 50) continue;
        const dx = px - screenX;
        const dy = py - p.roomY;
        if (Math.abs(dx) < 22 && Math.abs(dy) < 22) {
            if (!p.flipped) {
                p.flipped = true;
                p.flipTimer = 30;
                playPip();
            }
            p.collected = true;
            piecesCollected++;
            playSnap();
            showTopText(t('house.got.piece') + ' (' + piecesCollected + '/' + TOTAL_PIECES + ')', 120);
            updateTopTextForHouse();
            break;
        }
    }
}

// ===================== تفاعل الصف =====================
function handleClassroomTouch(px, py) {
    if (!yusufNotebookFound) {
        const worldTouchX = classroomX + px;
        for (let nb of notebooks) {
            if (nb.touched) continue;
            const dx = worldTouchX - nb.x;
            const dy = py - (nb.y - 20);
            if (Math.abs(dx) < 20 && Math.abs(dy) < 25) {
                nb.touched = true;
                if (nb.isYusuf) {
                    yusufNotebookFound = true;
                    playKeySound();
                    startTransition('drawing', () => { childDrawingOpen = true; });
                } else {
                    playPip();
                    storyBox.innerText = t('school.notebook') + ' ' + nb.name + '...';
                }
                break;
            }
        }
    }
    if (teacherLetterVisible && !teacherLetterOpen && yusufNotebookFound) {
        const worldTouchX = classroomX + px;
        const letterWorldX = 380 + 55;
        const letterWorldY = CLASSROOM_GROUND_Y - 85;
        if (Math.abs(worldTouchX - letterWorldX) < 30 && Math.abs(py - letterWorldY) < 30) {
            playPip();
            startTransition('letter', () => { teacherLetterOpen = true; });
        }
    }
}

// ===================== تفاعل قسم الطوارئ =====================
function handleEmergencyTouch(px, py) {
    for (let f of hiddenFiles) {
        if (f.collected) continue;
        const screenX = f.x - emergencyX;
        const screenY = f.y;
        if (screenX < -50 || screenX > W + 50) continue;
        const dx = px - screenX;
        const dy = py - screenY;
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30) {
            f.collected = true;
            collectedFiles[f.id] = true;
            playPip();
            currentFileIndex = f.id;
            currentFileOpen = true;
            filesRead = f.id;
            startTransition('file', () => {});
            return;
        }
    }
}

// ===================== تفاعل مشهد الملف =====================
function handleFileTouch(px, py) {
    if (px > fileButtonRect.x && px < fileButtonRect.x + fileButtonRect.w &&

// ===================== تفاعل رسالة الأم =====================
function handleMotherLetterTouch(px, py) {
    if (motherLetterPage === 0) {
        if (px > motherLetterNextRect.x && px < motherLetterNextRect.x + motherLetterNextRect.w &&
            py > motherLetterNextRect.y && py < motherLetterNextRect.y + motherLetterNextRect.h) {

// ===================== تفاعل زر النهاية =====================
function handleEndingTouch(px, py) {

    if (px > endingButtonRect.x && px < endingButtonRect.x + endingButtonRect.w &&

let drawingButtonRect = { x: 0, y: 0, w: 0, h: 0 };
let teacherLetterButtonRect = { x: 0, y: 0, w: 0, h: 0 };

function handleDrawingTouch(px, py) {
    if (px > drawingButtonRect.x && px < drawingButtonRect.x + drawingButtonRect.w &&
        py > drawingButtonRect.y && py < drawingButtonRect.y + drawingButtonRect.h) {
        childDrawingOpen = false;
        currentScene = 'classroom';
        teacherLetterVisible = true;
        storyBox.innerText = t('school.drawing.hint');
    }
}

function handleTeacherLetterTouch(px, py) {
    if (px > teacherLetterButtonRect.x && px < teacherLetterButtonRect.x + teacherLetterButtonRect.w &&
        py > teacherLetterButtonRect.y && py < teacherLetterButtonRect.y + teacherLetterButtonRect.h) {
        teacherLetterOpen = false;
        schoolCompleted = true;
        currentScene = 'classroom';
        storyBox.innerText = t('school.exited');
    }
}

function handlePuzzleTouch(px, py) {
    const unplaced = pieces.filter(p => p.collected && !p.placed);
    for (let i = 0; i < unplaced.length; i++) {
        const p = unplaced[i];
        const stackPos = getStackPos(i);
        if (px > stackPos.x && px < stackPos.x + STACK_PIECE_W &&
            py > stackPos.y && py < stackPos.y + STACK_PIECE_H) {
            draggingPiece = { piece: p, dragX: stackPos.x, dragY: stackPos.y };
            return;
        }
    }
}

function attemptPlacePiece(drag, px, py) {
    const p = drag.piece;
    const localX = px - BOARD_SCREEN_X;
    const localY = py - BOARD_SCREEN_Y;
    if (localX < 0 || localX > BOARD_SCREEN_W || localY < 0 || localY > BOARD_SCREEN_H) {
        playReject();
        return;
    }
    const col = Math.floor(localX / SLOT_W);
    const row = Math.floor(localY / SLOT_H);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) { playReject(); return; }

    if (col === p.col && row === p.row) {
        if (pieces.some(q => q !== p && q.placed && q.col === col && q.row === row)) {
            playReject();
            return;
        }
        p.placed = true;
        playSnap();
        checkPuzzleComplete();
    } else {
        playReject();
    }
}

function checkPuzzleComplete() {
    if (puzzleSolved) return;
    const allPlaced = pieces.every(p => p.placed);
    if (!allPlaced) return;
    puzzleSolved = true;
    playSnap();

    setTimeout(() => {
        keyDropped = true;
        keyPosition.x = BOARD_ROOM_X + PIC_W / 2;
        keyPosition.y = BOARD_ROOM_Y + PIC_H + 40;
        keyPosition.vy = 0;
        storyBox.innerText = t('house.puzzle.done');
    }, 800);

    setTimeout(() => {
        currentScene = 'house';
        worldX = BOARD_ROOM_X - W / 2 + 100;
        if (worldX < 0) worldX = 0;
        if (worldX > ROOM_WIDTH - W) worldX = ROOM_WIDTH - W;
        roomX = worldX;
    }, 1800);
}

// ===================== نصوص أعلى الشاشة =====================
let topText = { text: "", alpha: 0, targetAlpha: 0, timer: 0 };
let permanentHint = "";

function showTopText(text, duration) {
    topText.text = text;
    topText.targetAlpha = 1;
    topText.timer = duration;
}

function updateTopText() {
    if (topText.timer > 0) {
        topText.timer--;
        if (topText.timer === 0) topText.targetAlpha = 0;
    }
    topText.alpha += (topText.targetAlpha - topText.alpha) * 0.1;
    if (topText.alpha < 0.01 && topText.targetAlpha === 0) topText.alpha = 0;
}

function updateTopTextForHouse() {
    if (piecesCollected < TOTAL_PIECES) permanentHint = t('house.hint.find');
    else if (!puzzleSolved) permanentHint = t('house.hint.board');
    else if (keyDropped && !hasKey) permanentHint = t('house.hint.key');
    else if (hasKey && !messageOpen) permanentHint = t('house.hint.door');
}
function updateTopTextForSchool() {
    if (!yusufNotebookFound) permanentHint = t('school.hint.1');
    else if (yusufNotebookFound && !teacherLetterVisible) permanentHint = t('school.hint.2');
    else if (teacherLetterVisible && !schoolCompleted) permanentHint = t('school.hint.3');
    else if (schoolCompleted) permanentHint = t('school.hint.4');
}
function updateTopTextForHospital() {
    const remaining = 5 - collectedFiles.filter(c => c).length;
    if (remaining > 0) permanentHint = t('hospital.hint.hidden') + ' (' + t('hospital.hint.remaining') + ': ' + remaining + ')';
    else if (remaining === 0 && !hospitalCompleted) permanentHint = "";
}

// ===================== رسم الغرفة الداخلية =====================
function drawRoomInterior() {
    const wallGrad = ctx.createLinearGradient(0, 0, 0, ROOM_GROUND_Y);
    wallGrad.addColorStop(0, '#6a6a72');
    wallGrad.addColorStop(0.7, '#7a7a82');
    wallGrad.addColorStop(1, '#6a6a72');
    ctx.fillStyle = wallGrad;
    ctx.fillRect(0, 0, W, ROOM_GROUND_Y);

    ctx.strokeStyle = 'rgba(40, 40, 45, 0.55)';
    ctx.lineWidth = 1.5;
    const crackOffset = -roomX * 0.3;
    const cracks = [
        { x1: 100, y1: 40, x2: 140, y2: 130, x3: 120, y3: 220 },
        { x1: 500, y1: 60, x2: 540, y2: 150, x3: 510, y3: 260 },
        { x1: 900, y1: 80, x2: 940, y2: 180, x3: 920, y3: 280 },
        { x1: 1300, y1: 50, x2: 1340, y2: 160, x3: 1310, y3: 270 }
    ];
    cracks.forEach(c => {
        const sx = c.x1 + crackOffset;
        ctx.beginPath();
        ctx.moveTo(sx, c.y1);
        ctx.lineTo(c.x2 + crackOffset, c.y2);
        ctx.lineTo(c.x3 + crackOffset, c.y3);
        ctx.stroke();
    });

    ctx.strokeStyle = 'rgba(50,50,58,0.14)';
    ctx.lineWidth = 1;
    const brickOffset = -roomX * 0.3;
    for (let y = 30; y < ROOM_GROUND_Y; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(W, y);
        ctx.stroke();
    }
    for (let row = 0; row < 15; row++) {
        const y = 30 + row * 40;
        const off = (row % 2 === 0) ? 0 : 40;
        for (let x = brickOffset + off; x < W + 100; x += 80) {
            ctx.beginPath();
            ctx.moveTo(x, y); ctx.lineTo(x, y + 40);
            ctx.stroke();
        }
    }

    const winX = 300 - roomX;
    if (winX > -200 && winX < W + 200) {
        const lightGrad = ctx.createRadialGradient(winX + 60, 170, 10, winX + 60, 170, 180);
        lightGrad.addColorStop(0, 'rgba(220, 210, 180, 0.25)');
        lightGrad.addColorStop(1, 'rgba(220, 210, 180, 0)');
        ctx.fillStyle = lightGrad;
        ctx.fillRect(winX - 120, 60, 360, 360);

        ctx.fillStyle = '#a8a8b0';
        ctx.fillRect(winX, 100, 120, 140);
        ctx.strokeStyle = '#5a5a62';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(winX + 60, 100); ctx.lineTo(winX + 60, 240);
        ctx.moveTo(winX, 170); ctx.lineTo(winX + 120, 170);
        ctx.stroke();
        ctx.strokeStyle = '#3a3a42';
        ctx.lineWidth = 5;
        ctx.strokeRect(winX, 100, 120, 140);
        ctx.strokeStyle = '#2a2a32';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(winX + 20, 100); ctx.lineTo(winX + 40, 180); ctx.lineTo(winX + 30, 240);
        ctx.moveTo(winX + 90, 100); ctx.lineTo(winX + 80, 170); ctx.lineTo(winX + 100, 240);
        ctx.stroke();
    }

    const boardScreenX = BOARD_ROOM_X - roomX;
    if (boardScreenX > -250 && boardScreenX < W + 250) {
        ctx.save();
        const tilt = puzzleSolved ? 0 : -0.06;
        ctx.translate(boardScreenX + PIC_W/2, BOARD_ROOM_Y + PIC_H/2);
        ctx.rotate(tilt);
        ctx.translate(-PIC_W/2, -PIC_H/2);

        ctx.fillStyle = '#5a4a3a';
        ctx.fillRect(-6, -6, PIC_W + 12, PIC_H + 12);
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(-3, -3, PIC_W + 6, PIC_H + 6);

        if (puzzleSolved) {
            drawFamilyPicture(ctx, 0, 0, PIC_W, PIC_H, 1);
        } else {
            ctx.fillStyle = '#0a0a10';
            ctx.fillRect(0, 0, PIC_W, PIC_H);
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = pieces.find(q => q.col === c && q.row === r);
                    if (!p || !p.placed) {
                        ctx.fillStyle = '#1a1a20';
                        ctx.fillRect(c * PIECE_W + 1, r * PIECE_H + 1, PIECE_W - 2, PIECE_H - 2);
                        ctx.strokeStyle = 'rgba(80, 70, 50, 0.7)';
                        ctx.lineWidth = 1.5;
                        ctx.strokeRect(c * PIECE_W + 1, r * PIECE_H + 1, PIECE_W - 2, PIECE_H - 2);
                        ctx.fillStyle = 'rgba(120, 100, 60, 0.35)';
                        ctx.font = 'bold 18px "Segoe UI", Tahoma';
                        ctx.textAlign = 'center';
                        ctx.fillText('?', c * PIECE_W + PIECE_W/2, r * PIECE_H + PIECE_H/2 + 6);
                    } else {
                        drawPicturePiece(ctx, c * PIECE_W, r * PIECE_H, PIECE_W, PIECE_H, c, r, 1);
                    }
                }
            }
        }
        ctx.restore();
    }

    const floorGrad = ctx.createLinearGradient(0, ROOM_GROUND_Y, 0, H);

    ctx.fillStyle = 'rgba(40, 38, 35, 0.5)';

        }
    });

    ctx.fillStyle = '#5a5a62';
    const debris = [
        { x: 220, y: ROOM_GROUND_Y + 5, r: 4 },
        { x: 260, y: ROOM_GROUND_Y + 8, r: 3 },
        { x: 480, y: ROOM_GROUND_Y + 6, r: 5 },
        { x: 520, y: ROOM_GROUND_Y + 10, r: 3 },
        { x: 680, y: ROOM_GROUND_Y + 4, r: 4 },
        { x: 880, y: ROOM_GROUND_Y + 7, r: 5 },
        { x: 1280, y: ROOM_GROUND_Y + 5, r: 4 }
    ];

        const sx = d.x - roomX;
        if (sx > -20 && sx < W + 20) {
            ctx.beginPath();
            ctx.arc(sx, d.y, d.r, 0, Math.PI * 2);

    const tableX = 400 - roomX;
    if (tableX > -200 && tableX < W + 200) {

        ctx.fillRect(tableX + 10, ROOM_GROUND_Y - 5, 6, 25);
        ctx.fillRect(tableX + 80, ROOM_GROUND_Y - 5, 6, 20);

        ctx.fillRect(shelfX, ROOM_GROUND_Y - 40, 140, 8);
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(shelfX + 20, ROOM_GROUND_Y - 50, 20, 6);
        ctx.fillStyle = '#3a3a5a';
        ctx.fillRect(shelfX + 50, ROOM_GROUND_Y - 55, 18, 6);
        ctx.fillStyle = '#5a1a1a';
        ctx.fillRect(shelfX + 90, ROOM_GROUND_Y - 48, 22, 6);
    }

    const doorX = (ROOM_WIDTH - 250) - roomX;
    if (doorX > -200 && doorX < W + 200) {
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(doorX - 5, ROOM_GROUND_Y - 220, 110, 220);
        ctx.fillStyle = hasKey ? '#6a5a3a' : '#4a3a28';
        ctx.fillRect(doorX, ROOM_GROUND_Y - 215, 100, 215);
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(doorX, ROOM_GROUND_Y - 160); ctx.lineTo(doorX + 100, ROOM_GROUND_Y - 160);
        ctx.moveTo(doorX, ROOM_GROUND_Y - 100); ctx.lineTo(doorX + 100, ROOM_GROUND_Y - 100);
        ctx.moveTo(doorX, ROOM_GROUND_Y - 40); ctx.lineTo(doorX + 100, ROOM_GROUND_Y - 40);
        ctx.stroke();
        ctx.fillStyle = '#d4af37';
        ctx.beginPath();
        ctx.arc(doorX + 85, ROOM_GROUND_Y - 110, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    pieces.forEach(p => {
        if (p.collected || p.placed) return;
        const sx = p.roomX - roomX;
        if (sx < -40 || sx > W + 40) return;

        const glow = ctx.createRadialGradient(sx, p.roomY - 8, 1, sx, p.roomY - 8, 24);
        glow.addColorStop(0, 'rgba(212, 175, 55, 0.35)');
        glow.addColorStop(1, 'rgba(212, 175, 55, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, p.roomY - 8, 24, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(sx, p.roomY + 5, 14, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(sx - 14, p.roomY - 20, 28, 34);
        ctx.fillStyle = '#d4af37';
        ctx.fillRect(sx - 13, p.roomY - 19, 26, 32);

        if (!p.flipped) {
            ctx.fillStyle = '#4a4a52';

            ctx.fillStyle = 'rgba(212, 175, 55, 0.5)';
            ctx.beginPath();
            ctx.arc(sx, p.roomY - 3, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a20';

            ctx.fillText('?', sx, p.roomY + 2);
        } else {
            drawPicturePiece(ctx, sx - 12, p.roomY - 18, 24, 30, p.col, p.row, 1);

    });

    if (keyDropped && !keyPosition.collected) {
        const kx = keyPosition.x - roomX;
        const ky = keyPosition.y;
        if (kx > -50 && kx < W + 50) {
            const glow = ctx.createRadialGradient(kx, ky, 2, kx, ky, 20);
            glow.addColorStop(0, 'rgba(212, 175, 55, 0.5)');
            glow.addColorStop(1, 'rgba(212, 175, 55, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(kx, ky, 20, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(kx, ky - 5, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(kx - 1.5, ky - 3, 3, 12);
            ctx.fillRect(kx + 1.5, ky + 5, 4, 2);
            ctx.fillRect(kx + 1.5, ky + 9, 4, 2);
        }
    }
}

        ctx.fillStyle = '#4a3a28';
        ctx.fillRect(receptionX, EMERGENCY_GROUND_Y - 90, 200, 10);
        ctx.fillRect(receptionX + 15, EMERGENCY_GROUND_Y - 80, 8, 80);
        ctx.fillRect(receptionX + 180, EMERGENCY_GROUND_Y - 80, 8, 80);
    }

    const time = Date.now() / 1000;
    hiddenFiles.forEach(f => {
        if (f.collected) return;
        const screenX = f.x - emergencyX;
        const screenY = f.y;
        if (screenX < -60 || screenX > W + 60) return;

        const bob = Math.sin(time * 2 + f.bobPhase) * 2;
        const finalY = screenY + bob;

        const pulse = Math.sin(time * 3 + f.bobPhase) * 3;
        const glow = ctx.createRadialGradient(screenX, finalY - 12, 3, screenX, finalY - 12, 22 + pulse);
        glow.addColorStop(0, 'rgba(212, 175, 55, 0.5)');
        glow.addColorStop(1, 'rgba(212, 175, 55, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(screenX, finalY - 12, 22 + pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(screenX, finalY - 12);
        ctx.rotate((f.id % 2 === 0) ? -0.15 : 0.15);

        ctx.fillStyle = '#c8c0a8';
        ctx.fillRect(-16, -22, 32, 26);
        ctx.strokeStyle = '#7a6a52';
        ctx.lineWidth = 1;
        ctx.strokeRect(-16, -22, 32, 26);

        ctx.fillStyle = 'rgba(50, 25, 10, 0.7)';
        ctx.beginPath();
        ctx.moveTo(-16, -22);
        ctx.lineTo(-8, -16);
        ctx.lineTo(-16, -10);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(80, 65, 50, 0.6)';
        ctx.beginPath();
        ctx.moveTo(-12, -15); ctx.lineTo(8, -15);
        ctx.moveTo(-12, -9); ctx.lineTo(12, -9);
        ctx.moveTo(-12, -3); ctx.lineTo(5, -3);
        ctx.stroke();

        ctx.fillStyle = 'rgba(140, 25, 25, 0.8)';
        ctx.fillRect(6, -20, 6, 2.5);
        ctx.fillRect(7.75, -21.25, 2.5, 6);

        ctx.restore();
    });

    const doorX = (EMERGENCY_WIDTH - 250) - emergencyX;
    if (doorX > -200 && doorX < W + 200) {
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(doorX - 5, EMERGENCY_GROUND_Y - 220, 110, 220);
        ctx.fillStyle = hospitalCompleted ? '#6a5a3a' : '#4a3a28';
        ctx.fillRect(doorX, EMERGENCY_GROUND_Y - 215, 100, 215);
    }
}

function drawPuzzleScene() {
    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(0, 0, W, H);

    const lg = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, 500);
    lg.addColorStop(0, 'rgba(60, 50, 40, 0.3)');
    lg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#5a4a3a';
    ctx.fillRect(BOARD_SCREEN_X - 10, BOARD_SCREEN_Y - 10, BOARD_SCREEN_W + 20, BOARD_SCREEN_H + 20);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(BOARD_SCREEN_X - 5, BOARD_SCREEN_Y - 5, BOARD_SCREEN_W + 10, BOARD_SCREEN_H + 10);

    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(BOARD_SCREEN_X, BOARD_SCREEN_Y, BOARD_SCREEN_W, BOARD_SCREEN_H);

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x = BOARD_SCREEN_X + c * SLOT_W;
            const y = BOARD_SCREEN_Y + r * SLOT_H;
            const p = pieces.find(q => q.col === c && q.row === r);
            if (p && p.placed) {
                drawPicturePiece(ctx, x, y, SLOT_W, SLOT_H, c, r, 1);
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 1, y + 1, SLOT_W - 2, SLOT_H - 2);
            } else {
                ctx.fillStyle = 'rgba(30, 30, 40, 0.5)';
                ctx.fillRect(x + 1, y + 1, SLOT_W - 2, SLOT_H - 2);
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x + 1, y + 1, SLOT_W - 2, SLOT_H - 2);
            }
        }
    }

    ctx.fillStyle = 'rgba(20, 20, 25, 0.85)';
    ctx.fillRect(STACK_X - 5, STACK_Y - 5, 6 * (STACK_PIECE_W + 8) + 10, 2 * (STACK_PIECE_H + 8) + 10);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(STACK_X - 5, STACK_Y - 5, 6 * (STACK_PIECE_W + 8) + 10, 2 * (STACK_PIECE_H + 8) + 10);

    const unplaced = pieces.filter(p => p.collected && !p.placed);
    unplaced.forEach((p, i) => {
        if (draggingPiece && draggingPiece.piece === p) return;
        const pos = getStackPos(i);
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(pos.x - 2, pos.y - 2, STACK_PIECE_W + 4, STACK_PIECE_H + 4);
        ctx.fillStyle = '#d4af37';
        ctx.fillRect(pos.x - 1, pos.y - 1, STACK_PIECE_W + 2, STACK_PIECE_H + 2);
        drawPicturePiece(ctx, pos.x, pos.y, STACK_PIECE_W, STACK_PIECE_H, p.col, p.row, 1);
    });

    if (draggingPiece) {
        const p = draggingPiece.piece;
        drawPicturePiece(ctx, draggingPiece.dragX, draggingPiece.dragY, STACK_PIECE_W, STACK_PIECE_H, p.col, p.row, 0.9);
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(draggingPiece.dragX, draggingPiece.dragY, STACK_PIECE_W, STACK_PIECE_H);
    }

    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 22px "Segoe UI", Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText(t('house.puzzle.hint'), W/2, 45);

    ctx.font = '22px "Segoe UI", Tahoma';
    ctx.fillStyle = '#ccc';
    ctx.fillText(t('house.puzzle.remaining') + ': ' + unplaced.length, W/2, H - 15);
}

// ===================== رسم الشخصية =====================
function drawCharacter(blurOffsetX, blurAlpha) {
    const isMoving = player.isMoving;
    const wc = player.walkCycle;
    const bodyBob = isMoving ? Math.abs(Math.sin(wc)) * 2.2 : 0;
    const sway = isMoving ? Math.sin(wc) * 1.8 : 0;
    const breath = isMoving ? 0 : Math.sin(player.breathTime / 50) * 0.5;
    const groundY = (currentScene === 'house') ? player.roomGroundY :
                (currentScene === 'classroom' || currentScene === 'emergency') ? EMERGENCY_GROUND_Y :
                player.groundY;
    ctx.save();
    ctx.globalAlpha = blurAlpha;
    ctx.translate(player.x + blurOffsetX + sway * 0.3, groundY - bodyBob - breath);
    ctx.scale(player.direction, 1);

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 4, 22, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#050505';
    ctx.strokeStyle = '#050505';

    ctx.save();
    const robeSway = isMoving ? Math.sin(wc) * 3 : 0;
    ctx.beginPath();
    ctx.moveTo(-11, -95);
    ctx.quadraticCurveTo(-15 + robeSway, -50, -13 + robeSway * 1.5, 5);
    ctx.lineTo(13 + robeSway * 1.5, 5);
    ctx.quadraticCurveTo(15 + robeSway, -50, 11, -95);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    drawLeg(-4, -58, wc + Math.PI, true);
    drawLeg(4, -58, wc, false);

    ctx.save();
    ctx.translate(0, -98);
    ctx.lineWidth = 22;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 44); ctx.stroke();
    ctx.strokeStyle = 'rgba(212,175,55,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -5);
    ctx.quadraticCurveTo(0, 5, 8, -5);
    ctx.stroke();
    ctx.restore();

    drawArm(-5, -92, wc, true);

    ctx.strokeStyle = '#050505';
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(0, -102); ctx.lineTo(0, -112); ctx.stroke();

    ctx.save();
    ctx.translate(0, -126);
    ctx.rotate(player.headTilt);
    ctx.fillStyle = '#050505';
    ctx.beginPath(); ctx.arc(0, 0, 14.5, 0, Math.PI * 2); ctx.fill();
    if (!player.isBlinking) {
        ctx.fillStyle = '#d4af37';
        ctx.shadowColor = '#d4af37';
        ctx.shadowBlur = 5;
        ctx.fillRect(4, -3, 2.5, 1.5);
        ctx.shadowBlur = 0;
    }
    ctx.restore();

    drawArm(4, -92, wc, false);
    ctx.restore();
}

function drawLeg(hipX, hipY, phase, isBack) {
    const thighLen = 32, shinLen = 30;
    const hipAngle = Math.sin(phase) * 0.5;
    const kneeBend = Math.max(0, Math.sin(phase - 0.8)) * 0.85;
    const kneeAngle = hipAngle - kneeBend;
    const kneeX = hipX + Math.sin(hipAngle) * thighLen;
    const kneeY = hipY + Math.cos(hipAngle) * thighLen;
    const ankleX = kneeX + Math.sin(kneeAngle) * shinLen;
    const ankleY = kneeY + Math.cos(kneeAngle) * shinLen;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#050505';
    ctx.lineWidth = isBack ? 9.5 : 11.5;
    ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kneeX, kneeY); ctx.stroke();
    ctx.lineWidth = isBack ? 7.5 : 9.5;
    ctx.beginPath(); ctx.moveTo(kneeX, kneeY); ctx.lineTo(ankleX, ankleY); ctx.stroke();
}

function drawArm(shoulderX, shoulderY, phase, isBack) {
    const uL = 22, fL = 20;
    const aP = phase + Math.PI;
    const sA = Math.sin(aP) * 0.4;
    const eB = 0.5 + Math.max(0, Math.sin(aP + 0.3)) * 0.35;
    const fA = sA - eB;
    const eX = shoulderX + Math.sin(sA) * uL;
    const eY = shoulderY + Math.cos(sA) * uL;
    const hX = eX + Math.sin(fA) * fL;
    const hY = eY + Math.cos(fA) * fL;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#050505';
    ctx.lineWidth = isBack ? 5.5 : 6.5;
    ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(eX, eY); ctx.stroke();
    ctx.lineWidth = isBack ? 4.5 : 5.5;
    ctx.beginPath(); ctx.moveTo(eX, eY); ctx.lineTo(hX, hY); ctx.stroke();
}

// ===================== خلفية الطريق =====================
function drawRubblePile(cx, baseY, width, height, colorSeed, seed = 0) {
    const rand = (i) => {
        const x = Math.sin(seed + i * 12.9898) * 43758.5453;
        return x - Math.floor(x);
    };
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + 3, width * 0.55, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    const stones = 10;
    for (let i = 0; i < stones; i++) {
        const rx = cx - width/2 + rand(i) * width;
        const ry = baseY - rand(i + 100) * height;
        const sw = 20 + rand(i + 200) * 45;
        const sh = 12 + rand(i + 300) * 28;
        const rot = (rand(i + 400) - 0.5) * 1.2;
        const shade = 90 + Math.floor(rand(i + 500) * 50);
        ctx.save();
        ctx.translate(rx, ry);
        ctx.rotate(rot);
        ctx.fillStyle = `rgb(${shade - 15}, ${shade - 20}, ${shade - 25})`;
        ctx.beginPath();
        const verts = 5 + Math.floor(rand(i + 600) * 2);
        for (let v = 0; v < verts; v++) {
            const a = (v / verts) * Math.PI * 2;
            const r = 0.7 + rand(i * 10 + v) * 0.5;
            const px = Math.cos(a) * (sw/2) * r;
            const py = Math.sin(a) * (sh/2) * r;
            if (v === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

function drawBurntTree(cx, baseY, scale = 1, seed = 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + 2, 25 * scale, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0806';
    ctx.lineCap = 'round';
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(cx, baseY);
    ctx.lineTo(cx + 3 * scale, baseY - 60 * scale);
    ctx.stroke();
    ctx.lineWidth = 4 * scale;
    ctx.beginPath();
    ctx.moveTo(cx + 1 * scale, baseY - 45 * scale);
    ctx.quadraticCurveTo(cx - 25 * scale, baseY - 70 * scale, cx - 40 * scale, baseY - 95 * scale);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 2 * scale, baseY - 55 * scale);
    ctx.quadraticCurveTo(cx + 28 * scale, baseY - 80 * scale, cx + 38 * scale, baseY - 105 * scale);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 3 * scale, baseY - 60 * scale);
    ctx.quadraticCurveTo(cx + 5 * scale, baseY - 90 * scale, cx - 8 * scale, baseY - 115 * scale);
    ctx.stroke();
    ctx.lineWidth = 2 * scale;
    const branches = [
        [-40, -95, -55, -105], [-40, -95, -48, -115],
        [38, -105, 55, -115], [38, -105, 45, -125],
        [-8, -115, -18, -135], [-8, -115, 5, -140],
        [-25, -70, -35, -78], [28, -80, 42, -88]
    ];
    branches.forEach(([x1, y1, x2, y2]) => {
        ctx.beginPath();
        ctx.moveTo(cx + x1 * scale, baseY + y1 * scale);
        ctx.lineTo(cx + x2 * scale, baseY + y2 * scale);
        ctx.stroke();
    });
}

function drawBackground() {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrad.addColorStop(0,   '#4a4a52');
    skyGrad.addColorStop(0.3, '#5a5a62');
    skyGrad.addColorStop(0.6, '#6a6a72');
    skyGrad.addColorStop(1,   '#4a4a52');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, GROUND_Y);

    const hazeGrad = ctx.createLinearGradient(0, GROUND_Y - 220, 0, GROUND_Y);
    hazeGrad.addColorStop(0, 'rgba(60, 60, 68, 0)');
    hazeGrad.addColorStop(1, 'rgba(40, 40, 48, 0.85)');
    ctx.fillStyle = hazeGrad;
    ctx.fillRect(0, GROUND_Y - 220, W, 220);

    const sunX = W * 0.72, sunY = 180;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 110);
    sunGrad.addColorStop(0, 'rgba(180, 160, 130, 0.25)');
    sunGrad.addColorStop(0.5, 'rgba(140, 120, 100, 0.15)');

        ctx.lineTo(bx + 140, GROUND_Y - 35);

        ctx.lineTo(bx + 320, GROUND_Y - 40);
        ctx.lineTo(bx + 420, GROUND_Y - 60);
        ctx.lineTo(bx + 520, GROUND_Y - 30);

        ctx.lineTo(bx + 700, GROUND_Y + 5);
        ctx.lineTo(bx, GROUND_Y + 5);

    }

    const p2 = (worldX * 0.35) % 900;

function drawGround() {
    const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    groundGrad.addColorStop(0, '#6a645c');
    groundGrad.addColorStop(0.3, '#5a544c');
    groundGrad.addColorStop(1, '#3a342c');

    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    ctx.strokeStyle = '#3a342c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y);

// ===================== تحديث =====================
function updateRoad() {
    if (moveForward) player.vx += player.acceleration;
    else if (moveBack) player.vx -= player.acceleration;
    else { player.vx *= player.friction; if (Math.abs(player.vx) < 0.01) player.vx = 0; }
    player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
    if (player.vx > 0.05) player.direction = 1;
    else if (player.vx < -0.05) player.direction = -1;

    player.isMoving = Math.abs(player.vx) > 0.05;
    player.walkCycle += Math.abs(player.vx) * 0.06;
    if (player.isMoving) worldX += player.vx;
    if (worldX < 0) worldX = 0;

    player.blinkTimer++;
    if (!player.isBlinking && player.blinkTimer >= player.nextBlinkTime) {
        player.isBlinking = true; player.blinkTimer = 0;
        player.nextBlinkTime = 100 + Math.random() * 150;
    } else if (player.isBlinking && player.blinkTimer > 10) {
        player.isBlinking = false; player.blinkTimer = 0;
    }

    if (!houseCompleted && !houseEnteredFlag) {
        const hs = HOUSE_WORLD_X - worldX;
        if (player.x + 30 > hs + 80 && player.x + 30 < hs + 120 && player.direction === 1) {
            houseEnteredFlag = true;
            startTransition('house', () => {
                player.x = 200;
                worldX = 100;
                roomX = worldX;
                roadSoundsPaused = true;
                updateTopTextForHouse();
            });
        }
    }

    if (houseCompleted && !schoolCompleted && !schoolEnteredFlag) {
        const ss = SCHOOL_WORLD_X - worldX;
        const openDoorX = ss + 20 + SCHOOL_OPEN_DOOR * ((SCHOOL_WIDTH - 40) / SCHOOL_DOORS_COUNT);
        if (player.x + 30 > openDoorX && player.x + 30 < openDoorX + 45 && player.direction === 1) {
            schoolEnteredFlag = true;
            startTransition('classroom', () => {
                player.x = 480;
                classroomX = 0;
                roadSoundsPaused = true;
                storyBox.innerText = t('school.entered');
                updateTopTextForSchool();
            });
        }
    }

    if (schoolCompleted && !hospitalCompleted && !hospitalEnteredFlag) {
        const hs = HOSPITAL_WORLD_X - worldX;
        const openDoorX = hs + HOSPITAL_WIDTH / 2 - 30;
        if (player.x + 30 > openDoorX && player.x + 30 < openDoorX + 60 && player.direction === 1) {
            hospitalEnteredFlag = true;
            startTransition('emergency', () => {
                player.x = 480;
                emergencyX = 0;
                roadSoundsPaused = true;
                storyBox.innerText = t('hospital.entered');
                updateTopTextForHospital();
            });
        }
    }

    ashes.forEach(p => {
        p.x += p.speedX - player.vx * 0.2;
        p.y += p.speedY;
        if (p.y < 0) { p.y = H; p.x = Math.random() * W; }
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    });
    smokePuffs.forEach(s => {
        s.y += s.speedY; s.x += s.speedX - player.vx * 0.15;
        s.size += s.grow; s.life -= 0.002;
        if (s.life <= 0 || s.y < -s.size || s.x < -s.size || s.x > W + s.size) {
            s.x = Math.random() * W; s.y = 380 + Math.random() * 60;
            s.size = 40 + Math.random() * 70; s.life = 0.3 + Math.random() * 0.7;
            s.alpha = 0.1 + Math.random() * 0.1;
        }
    });

    windStreaks.forEach(w => {
        w.x += w.speed;
        if (w.x > W + w.length) {
            w.x = -w.length;
            w.y = Math.random() * H;
        }
    });
    floatingDebris.forEach(d => {
        d.x += d.speedX;
        d.y += d.speedY + Math.sin(Date.now() / 500 + d.rot) * 0.2;
        d.rot += d.rotSpeed;
        if (d.x > W + 20) {
            d.x = -20;
            d.y = Math.random() * (GROUND_Y - 100);
        }
    });

    lightningTimer++;
    if (!lightningActive && lightningTimer > 300 + Math.random() * 400) {
        lightningActive = true;
        lightningAlpha = 0.85;
        lightningTimer = 0;
        playThunder();
    }
    if (lightningActive) {
        lightningAlpha -= 0.06;
        if (lightningAlpha <= 0) {
            lightningActive = false;
            lightningAlpha = 0;
        }
    }

    player.breathTime++;

    memories.forEach(m => {
        if (!m.collected) {
            const dist = Math.abs((player.x + worldX) - m.x);
            if (dist < 45) {
                m.collected = true;
                memoriesCollected++;
                playSnap();
                storyBox.innerText = t(m.key);
                if (memoriesCollected === 10) {
                    setTimeout(() => {
                        storyBox.innerText = t('mem.all');
                    }, 1500);
                }
            }
        }
    });
}

function updateHouse() {
    if (moveForward) player.vx += player.acceleration;
    else if (moveBack) player.vx -= player.acceleration;
    else { player.vx *= player.friction; if (Math.abs(player.vx) < 0.01) player.vx = 0; }
    player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));

    player.isMoving = Math.abs(player.vx) > 0.05;

    player.x += player.vx;

    const camMinX = 150;
    const camMaxX = W - 150;

    if (player.x > camMaxX) {
        const diff = player.x - camMaxX;
        player.x = camMaxX;
        worldX += diff;
    }
    if (player.x < camMinX) {

    if (worldX < 0) {

        if (player.x < camMinX) player.x = camMinX;
    }
    const maxWX = ROOM_WIDTH - W;
    if (worldX > maxWX) {
        worldX = maxWX;
        if (player.x > camMaxX) player.x = camMaxX;
    }
    roomX = worldX;

    player.blinkTimer++;
    if (!player.isBlinking && player.blinkTimer >= player.nextBlinkTime) {
        player.isBlinking = true; player.blinkTimer = 0;
        player.nextBlinkTime = 100 + Math.random() * 150;
    } else if (player.isBlinking && player.blinkTimer > 10) {
        player.isBlinking = false; player.blinkTimer = 0;
    }

    if (keyDropped && !keyPosition.collected && !hasKey) {
        const playerWorldX = worldX + player.x;
        if (Math.abs(playerWorldX - keyPosition.x) < 60) {
            keyPosition.collected = true;
            hasKey = true;
            playKeySound();
            storyBox.innerText = t('house.key.taken');
            setTimeout(() => {
                startTransition('message', () => {
                    messageOpen = true;

        }
    }

    if (hasKey && !houseCompleted && !messageOpen) {
        const playerWorldX = worldX + player.x;
        const doorWorldX = ROOM_WIDTH - 200;
        if (Math.abs(playerWorldX - doorWorldX) < 80) {
            houseCompleted = true;
            storyBox.innerText = t('house.exited');
            startTransition('road', () => {
                worldX = HOUSE_WORLD_X + HOUSE_WIDTH + 50 - 480;
                if (worldX < 0) worldX = 0;
                player.x = 480;
                roadSoundsPaused = false;
                storyBox.innerText = t('house.completed');
            });
        }
    }

    if (piecesCollected === TOTAL_PIECES && !puzzleSolved && currentScene === 'house') {
        const playerWorldX = worldX + player.x;
        const boardCenterWorldX = BOARD_ROOM_X + PIC_W / 2;
        if (Math.abs(playerWorldX - boardCenterWorldX) < 120) {
            startTransition('puzzle', () => {});
        }
    }

    player.breathTime++;
}

function update() {

    updateTopText();
    if (currentScene === 'languageselection') return;

}

// ===================== رسم =====================
function drawTopText() {
    if (topText.alpha < 0.01) return;
    ctx.save();
    ctx.globalAlpha = topText.alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(W/2 - 280, 15, 560, 52);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(W/2 - 280, 15, 560, 52);
    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 22px "Segoe UI", Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText(topText.text, W/2, 48);
    ctx.restore();
}

function drawPermanentHint() {
    if (!permanentHint) return;
    if (currentScene !== 'house' && currentScene !== 'classroom' && currentScene !== 'emergency') return;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(W/2 - 300, 78, 600, 46);
    ctx.strokeStyle = 'rgba(212, 175, 55, 0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(W/2 - 300, 78, 600, 46);
    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 22px "Segoe UI", Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText(permanentHint, W/2, 110);
    ctx.restore();
}

function drawKeyIndicator() {
    if (!hasKey) return;
    ctx.save();
    ctx.translate(30, 30);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#d4af37';
    ctx.beginPath(); ctx.arc(0, -4, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-1.5, -1, 3, 12);
    ctx.fillRect(1.5, 6, 4, 2);
    ctx.fillRect(1.5, 10, 4, 2);
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    if (currentScene === 'languageselection') {
        drawLanguageSelectionScreen();
    }
    else if (currentScene === 'road') {
        drawBackground();

        if (lightningActive && lightningAlpha > 0) {
            ctx.fillStyle = `rgba(200, 210, 240, ${lightningAlpha * 0.25})`;
            ctx.fillRect(0, 0, W, GROUND_Y);
            ctx.strokeStyle = `rgba(220, 230, 255, ${lightningAlpha})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            const lx = W * 0.35;
            ctx.moveTo(lx, 0);
            ctx.lineTo(lx + 15, 80);
            ctx.lineTo(lx - 10, 140);
            ctx.lineTo(lx + 20, 220);
            ctx.stroke();
        }

        windStreaks.forEach(w => {
            ctx.strokeStyle = `rgba(180, 180, 190, ${w.alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(w.x, w.y);
            ctx.lineTo(w.x + w.length, w.y + 3);
            ctx.stroke();
        });

        ashes.forEach(p => {
            ctx.fillStyle = p.isEmber
                ? `rgba(255, 140, 40, ${p.alpha})`
                : `rgba(80, 80, 88, ${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });

        smokePuffs.forEach(s => {
            const a = s.alpha * s.life;
            const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size);
            grad.addColorStop(0, `rgba(80, 80, 88, ${a})`);
            grad.addColorStop(0.5, `rgba(70, 70, 78, ${a * 0.5})`);
            grad.addColorStop(1, 'rgba(70, 70, 78, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        });

        floatingDebris.forEach(d => {
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.rotate(d.rot);
            ctx.fillStyle = `rgba(120, 110, 100, ${d.alpha})`;
            ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
            ctx.restore();
        });

        drawGround();

        const hs = HOUSE_WORLD_X - worldX;
        if (hs > -300 && hs < W + 300) drawHouseExterior(hs, GROUND_Y);

        const ss = SCHOOL_WORLD_X - worldX;
        if (ss > -500 && ss < W + 500) drawSchoolExterior(ss, GROUND_Y);

        const hsp = HOSPITAL_WORLD_X - worldX;
        if (hsp > -500 && hsp < W + 500) drawHospitalExterior(hsp, GROUND_Y);

        memories.forEach(m => {
            const sx = m.x - worldX;
            if (!m.collected && sx > -60 && sx < W + 60) {
                const pulse = Math.sin(Date.now() / 180) * 4;
                const glow = ctx.createRadialGradient(sx, m.y, 2, sx, m.y, 20 + pulse);
                glow.addColorStop(0, 'rgba(212,175,55,1)');
                glow.addColorStop(0.4, 'rgba(255,200,80,0.5)');
                glow.addColorStop(1, 'rgba(212,175,55,0)');
                ctx.fillStyle = glow;
                ctx.beginPath(); ctx.arc(sx, m.y, 20 + pulse, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(sx, m.y, 4, 0, Math.PI * 2); ctx.fill();
            }
        });

        const camShake = player.isMoving ? Math.sin(player.walkCycle * 0.4) * 0.3 : 0;
        if (player.isMoving) drawCharacter(-player.vx * 1.8 + camShake, 0.18);
        drawCharacter(camShake, 1.0);
    }
    else if (currentScene === 'house') {
        drawRoomInterior();
        const camShake = player.isMoving ? Math.sin(player.walkCycle * 0.4) * 0.3 : 0;
        if (player.isMoving) drawCharacter(-player.vx * 1.8 + camShake, 0.18);
        drawCharacter(camShake, 1.0);
        drawPermanentHint();
        drawKeyIndicator();
    }
    else if (currentScene === 'puzzle') drawPuzzleScene();
    else if (currentScene === 'message') drawMessageScene();
    else if (currentScene === 'classroom') {
        drawClassroomInterior();
        const camShake = player.isMoving ? Math.sin(player.walkCycle * 0.4) * 0.3 : 0;
        if (player.isMoving) drawCharacter(-player.vx * 1.8 + camShake, 0.18);
        drawCharacter(camShake, 1.0);
        drawPermanentHint();
    }
    else if (currentScene === 'drawing') drawDrawingScene();
    else if (currentScene === 'letter') drawTeacherLetterScene();
    else if (currentScene === 'emergency') {
        drawEmergencyRoom();
        const camShake = player.isMoving ? Math.sin(player.walkCycle * 0.4) * 0.3 : 0;
        if (player.isMoving) drawCharacter(-player.vx * 1.8 + camShake, 0.18);
        drawCharacter(camShake, 1.0);
        drawPermanentHint();
    }
    else if (currentScene === 'file') drawFileScene();
    else if (currentScene === 'motherletter') drawMotherLetterScene();
    else if (currentScene === 'ending') drawEndingScene();

    if (currentScene !== 'languageselection' && currentScene !== 'file' && currentScene !== 'motherletter' && currentScene !== 'ending') {
        drawTopText();
    }

    if (transitionAlpha > 0.001) {
        ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
        ctx.fillRect(0, 0, W, H);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// تهيئة أولية: ابدأ بشاشة اختيار اللغة
storyBox.innerText = '';
updateLangSwitchVisibility();

// ربط زر تبديل اللغة
document.getElementById('langSwitchBtn').addEventListener('click', () => {
    toggleLanguage();
});

gameLoop();
</script>
</body>
